[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuro-ai-terminal"
version = "0.2.0"
description = "NEURO — an always-on biopunk AI terminal interface. Talk to your shell in plain English."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "kris" },
]
keywords = ["terminal", "ai", "assistant", "natural-language", "llm", "ollama", "repl", "biopunk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
neuro = "pls.cli:main"
neuro-gui = "pls.gui:main"



[tool.hatch.build.targets.wheel]
packages = ["pls"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
